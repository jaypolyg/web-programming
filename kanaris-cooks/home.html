<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanaris Cooks | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="container my-4" style="max-width:1000px;">
  <div class="section-card mb-4 d-flex justify-content-between">
    <strong>Welcome, <span id="username"></span></strong>
    <a href="index.html" class="btn btn-secondary btn-sm">Logout</a>
  </div>

  <div class="brand-header mb-4">
    <h1>Kanaris Cooks</h1>
    <p class="fst-italic">Discover and Share Amazing Recipes</p>
  </div>

  <div class="section-card mb-4">
    <div class="row g-2">
      <div class="col-md-8">
        <input id="searchInput" class="form-control" placeholder="Search recipes...">
      </div>
      <div class="col-md-4">
        <select id="sortSelect" class="form-select">
          <option value="date">Sort by Date</option>
          <option value="title">Sort by Title</option>
          <option value="rating">Sort by Rating</option>
        </select>
      </div>
    </div>
  </div>

  <div id="recipeList" class="section-card"></div>

  <div id="pagination" class="mt-4 text-center"></div>
</div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/recipes.js"></script>
<script>
const usernameSpan = document.getElementById("username");
const storedUsername = localStorage.getItem("username");
usernameSpan.textContent = storedUsername ? storedUsername : "Guest";
</script>
</body>
</html>
