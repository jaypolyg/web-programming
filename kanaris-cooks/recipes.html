<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanaris Cooks | Recipe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="container my-4" style="max-width:800px;">
  <a href="home.html" class="text-brand">&larr; Back to recipes</a>

  <div id="recipeDetail" class="section-card mt-3"></div>
</div>

<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get("id"));
  const recipe = recipes.find(r => r.id === id);

  const container = document.getElementById("recipeDetail");

  if (!recipe) {
    container.innerHTML = "<p>Recipe not found.</p>";
  } else {
    container.innerHTML = `
      <h2>${recipe.title}</h2>
      <p class="text-muted">${recipe.author} • ${recipe.cuisine}</p>

      <p>${recipe.description}</p>

      <h5>Ingredients</h5>
      <ul>
        ${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}
      </ul>

      <h5>Instructions</h5>
      <ol>
        ${recipe.instructions.map(s => `<li>${s}</li>`).join("")}
      </ol>

      <div class="recipe-notes">
        <strong>Notes:</strong> ${recipe.notes}
      </div>
    `;
  }
</script>
</body>
</html>
